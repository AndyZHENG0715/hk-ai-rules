name: Build HK AI Rules

on:
  schedule:
    - cron: '0 22 * * *'   # 06:00 HKT daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sing-box
        run: |
          curl -sL -o sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v1.12.0/sing-box-1.12.0-linux-amd64.tar.gz"
          tar xzf sb.tar.gz
          sudo install -m 0755 sing-box-*/sing-box /usr/local/bin/
          sing-box version

      - name: Build rule sets
        run: |
          python3 scripts/build_rules.py
          ls -la *.srs *.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.srs *.json
          git diff --cached --quiet || git commit -m "chore: auto-update rule sets $(date -u +%Y-%m-%d)"
          git push
