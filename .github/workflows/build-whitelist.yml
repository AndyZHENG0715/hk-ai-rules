name: Build HK Whitelist

on:
  schedule:
    - cron: '0 22 * * *'   # 每天 UTC 22:00 = 香港 06:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 sing-box
        run: |
          curl -sL -o sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v1.12.0/sing-box-1.12.0-linux-amd64.tar.gz"
          tar xzf sb.tar.gz
          sudo install -m 0755 sing-box-*/sing-box /usr/local/bin/
          sing-box version

      - name: 生成香港可用 AI 白名单 srs
        run: |
          python3 scripts/build_whitelist.py scripts/hk-whitelist.txt ai-services.srs
          ls -la ai-services.srs

      - name: 编译补充名单（上游未收录但需代理）
        run: |
          sing-box rule-set compile --output supplement.srs supplement.json
          ls -la supplement.srs

      - name: 提交并推送（仅当有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-services.srs supplement.srs
          git diff --cached --quiet || git commit -m "chore: 更新 AI 规则 $(date -u +%Y-%m-%d)"
          git push
